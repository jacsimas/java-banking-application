spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
jpa:
  hibernate:
    ddl-auto: create-drop   # build schema from your @Entity classes for tests

  # Turn off Flyway for unit tests (so your Postgres-specific migrations are not run)
  flyway:
    enabled: false