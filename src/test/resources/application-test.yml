spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
jpa:
  hibernate:
    ddl-auto: create-drop   # build schema from your @Entity classes for tests
  open-in-view: false
  properties:
    hibernate:
      format_sql: true
      show_sql: false

  # Turn off Flyway for unit tests (so your Postgres-specific migrations are not run)
  flyway:
    enabled: false

  # If you have schema.sql/data.sql you *don’t* want in unit tests:
  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: INFO